# Publica index.html en GitHub Pages automáticamente cada vez que subes
# (push) cambios a la rama "main".
#
# Para activarlo: agrega este archivo a tu repo (misma ruta:
# .github/workflows/deploy.yml), y en Settings -> Pages, en "Source"
# elige "GitHub Actions" en vez de "Deploy from a branch".
name: Deploy a GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Subir el sitio (raíz del repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
